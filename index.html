  #boot { font-family: 'Manrope', sans-serif; }

  /* ============================================================
     ARREGLOS ESPECÍFICOS PARA MÓVIL
     ============================================================ */

  /* 1) Altura real de pantalla en móvil.
     100vh en Chrome/Safari móvil NO descuenta la barra de
     direcciones que aparece/desaparece al hacer scroll, así que
     el layout se corta o deja huecos en blanco. dvh (dynamic
     viewport height) sí se ajusta. Se deja vh como respaldo. */
  .app-shell {
    min-height: 100vh;
    min-height: 100dvh;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
    box-sizing: border-box;
  }

  /* 2) Evita el zoom automático de iOS al enfocar un input.
     iOS Safari hace zoom si el font-size del campo es < 16px. */
  input, select, textarea {
    font-size: 16px;
  }

  /* 3) Quita el retraso de 300ms al tocar y el "doble tap zoom"
     accidental en botones y elementos interactivos. */
  button, a, select {
    touch-action: manipulation;
  }

  /* 4) Evita que los inputs numéricos con flechitas (spinners)
     se vean distinto/rotos entre Android y iOS. */
  input[type="number"] {
    -moz-appearance: textfield;
  }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  /* 5) Evita que el usuario pueda seleccionar texto sin querer
     al tocar varias veces seguidas un botón (típico en móvil). */
  button {
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
</style>

<script type="text/babel" data-type="module" data-presets="react">
// ============================================================================

const firebaseConfig = {
   apiKey: "AIzaSyBx5Od4uc596GPSlstZMtIOmunBHk3FmwE",

  projectId: "subasta-5dce2",
  storageBucket: "subasta-5dce2.firebasestorage.app",
  messagingSenderId: "626450804815",
  appId: "1:626450804815:web:558fbf25e5243e7e3d7a3a"
};
// Nombre de la colección en Firestore.
const COLLECTION = "subastas";

// Especificadores "desnudos" resueltos por el import map de arriba.
import React, { useState, useEffect, useRef, useCallback } from "react";
import { createRoot } from "react-dom/client";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, doc, onSnapshot, runTransaction, setDoc, deleteDoc, getDoc,
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {
  getAuth, signInAnonymously, onAuthStateChanged,
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const auth = getAuth(fbApp);

// Sala: permite tener varias subastas en el mismo despliegue con ?sala=loquesea
const SALA = (new URLSearchParams(location.search).get("sala") || "principal")
  .toLowerCase().replace(/[^a-z0-9-]/g, "").slice(0, 40) || "principal";
const auctionRef = doc(db, COLLECTION, SALA);
const ME_KEY = `subasta-identidad-${SALA}`;

// ---------- helpers ----------
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function nowMs() { return Date.now(); }
function countActive(activeStatus) {
  return Object.values(activeStatus).filter((s) => s === "active").length;
}
function nextActiveIndex(order, activeStatus, fromIndex) {
  const n = order.length;
  for (let step = 1; step <= n; step++) {
    const idx = (fromIndex + step) % n;
    if (activeStatus[order[idx]] === "active") return idx;
  }
  return null;
}
function getMinValid(s) {
  if (!s) return 0;
  return s.highestBid != null ? s.highestBid + s.vehicle.increment : s.vehicle.minPrice;
}
function fmt(n, currency) {
  if (n == null) return "—";
  return `${currency} ${Number(n).toLocaleString("es-CO")}`;
}
function timeAgo(ts) {
  const d = new Date(ts);
  return d.toLocaleTimeString("es-CO", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
}
// Hash del PIN. No es seguridad real (4 dígitos se rompen por fuerza bruta),
// pero evita que el PIN quede a la vista de cualquiera que abra la consola.
async function hashPin(pin) {
  const data = new TextEncoder().encode(`${SALA}:${pin}`);
  const buf = await crypto.subtle.digest("SHA-256", data);
  return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
}
function loadMe() {
  try { return JSON.parse(localStorage.getItem(ME_KEY)) || null; } catch (e) { return null; }
}
function saveMe(me) {
  try { localStorage.setItem(ME_KEY, JSON.stringify(me)); } catch (e) {}
}
function clearMe() {
  try { localStorage.removeItem(ME_KEY); } catch (e) {}
}
// Copia al portapapeles con respaldo para navegadores móviles / in-app
// (WhatsApp, Instagram, etc.) que no siempre soportan navigator.clipboard.
async function copyToClipboard(text) {
  if (navigator.clipboard && window.isSecureContext) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch (e) { /* sigue al respaldo */ }
  }
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.left = "-9999px";
    ta.style.top = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch (e) {
    return false;
  }
}

// ---------- shared UI bits ----------

  );
}
function GhostButton({ children, onClick, disabled, className = "" }) {

      onClick={onClick}
      disabled={disabled}
      className={`w-full border border-slate-700 text-slate-300 font-medium py-3 rounded-xl

        focus:outline-none focus:ring-2 focus:ring-slate-500 transition-colors ${className}`}

}
function DangerButton({ children, onClick, disabled, className = "" }) {

}

      {open && (

          <li>Cada turno dura {turnDuration || 30} segundos.</li>
          <li>Para ofertar hay que superar la oferta actual por al menos el incremento mínimo.</li>
          <li>Quien no oferta en su turno (o se acaba el tiempo) queda eliminado y no vuelve a participar.</li>
          <li>Gana quien tenga la oferta más alta cuando solo quede una persona activa.</li>
        </ul>
      )}
    </div>
  );
}
function SessionBar({ myName, isHost, onForget }) {
  return (
    <div className="mt-6 pt-4 border-t border-slate-900 flex items-center justify-between text-xs text-slate-600">
      <span className="font-mono">sala: {SALA}</span>
      <button

        className="underline underline-offset-2 hover:text-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-600 rounded"

}
function ConnectionBadge({ online }) {

  return (

}

// ---------- Landing ----------
function Landing({ auctionExists, onChooseHost, onChooseParticipant }) {

// ---------- Create form ----------
function CreateForm({ onCreate, onBack, error, busy }) {
  const [title, setTitle] = useState("");
  const [subtitle, setSubtitle] = useState("");
  const [currency, setCurrency] = useState("$");
  const [minPrice, setMinPrice] = useState("");
  const [increment, setIncrement] = useState("");
  const [turnDuration, setTurnDuration] = useState("20");
  const [hostPin, setHostPin] = useState("");
  const [namesText, setNamesText] = useState("");
  const nameCount = namesText.split("\n").map((s) => s.trim()).filter(Boolean).length;
  const roundMinutes = Math.round((nameCount * (Number(turnDuration) || 0)) / 60);
  return (
    <Shell>
      <button type="button" onClick={onBack} className="text-slate-500 text-sm mb-4 focus:outline-none focus:ring-2 focus:ring-slate-500 rounded">
        ← Volver
      </button>
      <h1 className="font-display text-2xl font-semibold text-amber-400 mb-1">Crear subasta</h1>
      <p className="text-slate-400 text-sm mb-5">Configura el vehículo, las reglas y la lista de participantes.</p>
      <div className="space-y-4">
        <div>
          <label className="text-xs text-slate-400 mb-1 block">Vehículo</label>
          <input value={title} onChange={(e) => setTitle(e.target.value)} placeholder="Ej: Toyota Corolla 2019"
            className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-400" />
        </div>
        <div>
          <label className="text-xs text-slate-400 mb-1 block">Descripción (opcional)</label>
          <input value={subtitle} onChange={(e) => setSubtitle(e.target.value)} placeholder="Ej: 85.000 km, único dueño"
            className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-400" />
        </div>
        <div className="grid grid-cols-3 gap-3">
          <div>
            <label className="text-xs text-slate-400 mb-1 block">Moneda</label>
            <input value={currency} onChange={(e) => setCurrency(e.target.value)}
              className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 font-mono focus:outline-none focus:ring-2 focus:ring-amber-400" />
          </div>
          <div className="col-span-2">
            <label className="text-xs text-slate-400 mb-1 block">Precio mínimo</label>
            <input type="number" inputMode="numeric" pattern="[0-9]*" min="0" value={minPrice} onChange={(e) => setMinPrice(e.target.value)} placeholder="5000000"
              className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 font-mono focus:outline-none focus:ring-2 focus:ring-amber-400" />
          </div>
        </div>
        <div className="grid grid-cols-2 gap-3">
          <div>
            <label className="text-xs text-slate-400 mb-1 block">Incremento mínimo</label>
            <input type="number" inputMode="numeric" pattern="[0-9]*" min="1" value={increment} onChange={(e) => setIncrement(e.target.value)} placeholder="100000"
              className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 font-mono focus:outline-none focus:ring-2 focus:ring-amber-400" />
          </div>
          <div>
            <label className="text-xs text-slate-400 mb-1 block">Segundos por turno</label>
            <input type="number" inputMode="numeric" pattern="[0-9]*" min="5" value={turnDuration} onChange={(e) => setTurnDuration(e.target.value)}
              className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 font-mono focus:outline-none focus:ring-2 focus:ring-amber-400" />
          </div>
        </div>
        <div>
          <label className="text-xs text-slate-400 mb-1 block">PIN del organizador (4 dígitos)</label>
          <input
            type="text"
            inputMode="numeric"
            pattern="[0-9]*"
            maxLength={4}
            value={hostPin}
            onChange={(e) => setHostPin(e.target.value.replace(/\D/g, ""))}
            placeholder="1234"
            className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 font-mono tracking-widest focus:outline-none focus:ring-2 focus:ring-amber-400"
          />
          <p className="text-xs text-slate-500 mt-1">
            Solo quien tenga este PIN puede forzar pases o reiniciar. No lo compartas en el grupo.
          </p>
        </div>
        <div>
          <label className="text-xs text-slate-400 mb-1 block">Participantes (un nombre por línea)</label>
          <textarea value={namesText} onChange={(e) => setNamesText(e.target.value)} rows={8}
            placeholder={"María Gómez\nCarlos Ruiz\nAna Torres\n..."}
            className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-400" />
          <p className="text-xs text-slate-500 mt-1">
            {nameCount} nombres cargados
            {nameCount > 0 && roundMinutes > 0 && ` · una ronda completa toma ~${roundMinutes} min`}
          </p>
        </div>
        {error && <p className="text-red-400 text-sm">{error}</p>}
        <PrimaryButton
          disabled={busy}
          onClick={() =>
            onCreate({ title, subtitle, currency, minPrice, increment, turnDuration, hostPin, namesText })
          }
        >
          {busy ? "Creando…" : "Crear subasta"}
        </PrimaryButton>
      </div>
    </Shell>
  );
}

// ---------- Host PIN ----------
function HostPinForm({ onConfirm, onBack, error, busy }) {
  const [pin, setPin] = useState("");
  return (
    <Shell>

// ---------- Lobby ----------
function Lobby({ state, isHost, myName, onStart, onReset, onForget, online }) {
  const shareUrl = `${location.origin}${location.pathname}?sala=${SALA}`;
  const [copied, setCopied] = useState(false);
  const [copyError, setCopyError] = useState(false);
  return (
    <Shell>
      <ConnectionBadge online={online} />
      <p className="text-xs text-amber-400 uppercase tracking-wide mb-1">
        {isHost ? "Organizador" : `Participante · ${myName}`}
      </p>
      <h1 className="font-display text-2xl font-semibold mb-1">{state.vehicle.title}</h1>
      {state.vehicle.subtitle && <p className="text-slate-400 text-sm mb-4">{state.vehicle.subtitle}</p>}
      <Card className="mb-4">
        <div className="grid grid-cols-2 gap-3 text-sm">
          <div>
            <p className="text-slate-500 text-xs">Precio mínimo</p>
            <p className="font-mono text-amber-400 text-lg">{fmt(state.vehicle.minPrice, state.vehicle.currency)}</p>
          </div>
          <div>
            <p className="text-slate-500 text-xs">Incremento mínimo</p>
            <p className="font-mono text-lg">{fmt(state.vehicle.increment, state.vehicle.currency)}</p>
          </div>
          <div>
            <p className="text-slate-500 text-xs">Segundos por turno</p>
            <p className="font-mono text-lg">{state.vehicle.turnDuration}s</p>
          </div>
          <div>
            <p className="text-slate-500 text-xs">Participantes</p>
            <p className="font-mono text-lg">{state.participants.length}</p>
          </div>
        </div>
      </Card>
      <Card className="mb-4">
        <p className="text-xs text-slate-500 mb-2">Lista de participantes</p>
        <div className="flex flex-wrap gap-2">
          {state.participants.map((p) => (
            <span key={p} className="text-xs bg-slate-800 border border-slate-700 rounded-full px-2 py-1">
              {p}{p === myName ? " (tú)" : ""}
            </span>
          ))}
        </div>
      </Card>
      {isHost ? (
        <div className="space-y-3">
          <GhostButton
            onClick={async () => {
              const ok = await copyToClipboard(shareUrl);
              if (ok) { setCopyError(false); setCopied(true); setTimeout(() => setCopied(false), 2000); }
              else { setCopyError(true); }
            }}
          >
            {copied ? "Enlace copiado" : "Copiar enlace para el grupo"}
          </GhostButton>
          {copyError && (
            <div className="text-xs text-amber-300 bg-amber-500/10 border border-amber-500/30 rounded-lg px-3 py-2 break-all">
              No se pudo copiar automáticamente. Copia este enlace manualmente:
              <div className="font-mono mt-1 select-all">{shareUrl}</div>
            </div>
          )}
          <PrimaryButton onClick={onStart}>Iniciar subasta y asignar turnos</PrimaryButton>
          <p className="text-xs text-slate-500 text-center">
            El orden de turnos se sorteará en este momento.
          </p>
          <DangerButton onClick={onReset}>Reiniciar todo</DangerButton>
        </div>
      ) : (
        <Card>
          <p className="text-slate-300 text-sm">Esperando a que el organizador inicie la subasta…</p>
        </Card>
      )}
      <HowItWorks turnDuration={state.vehicle.turnDuration} />
      <SessionBar myName={myName} isHost={isHost} onForget={onForget} />
    </Shell>
  );
}

// ---------- Active board ----------
function ActiveBoard({ state, isHost, myName, nowTick, bidInput, setBidInput, onBid, onPass, onForcePass, onReset, onForget, actionError, busy, online }) {
  const turnName = state.order[state.currentIndex];
  const isMyTurn = turnName === myName;
  const remaining = state.turnStartedAt != null
    ? Math.max(0, state.vehicle.turnDuration - Math.floor((nowTick - state.turnStartedAt) / 1000))
    : state.vehicle.turnDuration;
  const pct = Math.round((remaining / state.vehicle.turnDuration) * 100);
  const urgent = remaining <= 10;
  const minValid = getMinValid(state);
  const iPassed = state.activeStatus[myName] === "passed";
  return (
    <Shell>
      <ConnectionBadge online={online} />
      <p className="text-xs text-amber-400 uppercase tracking-wide mb-1">
        {isHost ? "Organizador" : `Participante · ${myName}`}
      </p>
      <h1 className="font-display text-2xl font-semibold mb-1">{state.vehicle.title}</h1>
      {state.vehicle.subtitle && <p className="text-slate-400 text-sm mb-4">{state.vehicle.subtitle}</p>}
      <Card className="mb-4 text-center">
        <p className="text-xs text-slate-500 mb-1">
          {state.highestBid != null ? `Oferta más alta · ${state.highestBidder}` : "Aún sin ofertas · precio mínimo"}
        </p>
        <p className="font-mono text-3xl sm:text-4xl font-semibold text-amber-400 tracking-wider break-all">
          {fmt(state.highestBid != null ? state.highestBid : state.vehicle.minPrice, state.vehicle.currency)}
        </p>
      </Card>
      <Card className={`mb-4 ${isMyTurn ? "border-emerald-500" : ""}`}>
        <div className="flex items-center justify-between mb-2">
          <p className={`text-sm font-semibold ${isMyTurn ? "text-emerald-400" : "text-slate-300"}`}>
            {isMyTurn ? "¡Es tu turno!" : `Turno de ${turnName}`}
          </p>
          <p className={`font-mono text-xl ${urgent ? "text-red-400 urgent" : "text-slate-200"}`}>{remaining}s</p>
        </div>
        <div className="w-full h-2 bg-slate-800 rounded-full overflow-hidden mb-3">
          <div
            className={`h-full ${urgent ? "bg-red-500" : "bg-amber-400"}`}
            style={{ width: `${pct}%`, transition: "width 1s linear" }}
          />
        </div>
        {isMyTurn && (
          <div className="space-y-2">
            <label className="text-xs text-slate-400 block">
              Tu oferta (mínimo válido: {fmt(minValid, state.vehicle.currency)})
            </label>
            <input
              type="number"
              inputMode="numeric"
              pattern="[0-9]*"
              value={bidInput}
              onChange={(e) => setBidInput(e.target.value)}
              className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-3 font-mono text-lg focus:outline-none focus:ring-2 focus:ring-emerald-400"
            />
            <div className="grid grid-cols-2 gap-2 pt-1">
              <PrimaryButton onClick={onBid} disabled={busy} className="bg-emerald-500 hover:bg-emerald-400 active:bg-emerald-600 text-slate-950">
                Ofertar
              </PrimaryButton>
              <DangerButton onClick={onPass} disabled={busy}>Pasar</DangerButton>
            </div>
          </div>
        )}
        {!isMyTurn && iPassed && (
          <p className="text-xs text-slate-500 mt-1">Ya pasaste, quedaste fuera de esta subasta.</p>
        )}
      </Card>
      {actionError && <p className="text-red-400 text-sm mb-3">{actionError}</p>}
      <Card className="mb-4">
        <p className="text-xs text-slate-500 mb-2">Orden de turnos</p>
        <div className="flex gap-2 overflow-x-auto pb-1 -mx-1 px-1" style={{ WebkitOverflowScrolling: "touch" }}>
          {state.order.map((name, idx) => {
            const st = state.activeStatus[name];
            const isCurrent = idx === state.currentIndex;
            const paddle = idx + 1;
            return (
              <div
                key={name}
                className={`shrink-0 text-center rounded-xl px-3 py-2 border text-xs
                  ${isCurrent ? "border-amber-400 ring-2 ring-amber-400" : "border-slate-800"}
                  ${st === "passed" ? "bg-slate-900 text-slate-600 line-through" : "bg-slate-800 text-slate-200"}`}
              >
                <div className="font-mono text-amber-400">#{paddle}</div>
                <div>{name}{name === myName ? " (tú)" : ""}</div>
              </div>
            );
          })}
        </div>
      </Card>
      <History history={state.history} currency={state.vehicle.currency} label="Ver historial" />
      {isHost && (
        <div className="space-y-2">
          <GhostButton onClick={onForcePass} disabled={busy}>Forzar pase del turno actual</GhostButton>
          <DangerButton onClick={onReset}>Reiniciar todo</DangerButton>
        </div>
      )}
      <HowItWorks turnDuration={state.vehicle.turnDuration} />
      <SessionBar myName={myName} isHost={isHost} onForget={onForget} />
    </Shell>
  );
}

// ---------- History ----------
function History({ history, currency, label }) {
  return (
    <details className="mb-4">
      <summary className="text-xs text-slate-500 cursor-pointer select-none">{label}</summary>
      <div className="mt-2 space-y-1 max-h-56 overflow-y-auto" style={{ WebkitOverflowScrolling: "touch" }}>
        {[...history].reverse().map((h, i) => (
          <p key={i} className="text-xs text-slate-400 font-mono">
            {timeAgo(h.at)} · {h.type === "bid" && `${h.name} ofertó ${fmt(h.amount, currency)}`}
            {h.type === "pass" && `${h.name} pasó`}
            {h.type === "timeout" && `${h.name} se quedó sin tiempo`}
            {h.type === "forced" && `El organizador pasó el turno de ${h.name}`}
            {h.type === "start" && "Inicio de la subasta"}
            {h.type === "created" && "Subasta creada"}
          </p>
        ))}
      </div>
    </details>
  );
}

// ---------- Finished ----------
function Finished({ state, isHost, myName, onReset, onForget }) {
  return (
    <Shell>
      <h1 className="font-display text-2xl font-semibold mb-4 text-amber-400">Subasta terminada</h1>
      <Card className="text-center mb-4">
        {state.winner ? (
          <>
            <p className="text-slate-400 text-sm mb-2">{state.vehicle.title}</p>
            <p className="font-display text-2xl font-semibold text-emerald-400 mb-1">{state.winner.name}</p>
            <p className="text-slate-400 text-sm mb-2">se lo lleva por</p>
            <p className="font-mono text-3xl font-semibold text-amber-400 break-all">
              {fmt(state.winner.amount, state.vehicle.currency)}
            </p>
          </>
        ) : (
          <p className="text-slate-300">Todos los participantes pasaron. No hubo ganador.</p>
        )}
      </Card>
      <History history={state.history} currency={state.vehicle.currency} label="Ver historial completo" />
      {isHost && <PrimaryButton onClick={onReset}>Crear una nueva subasta</PrimaryButton>}
      <SessionBar myName={myName} isHost={isHost} onForget={onForget} />
    </Shell>
  );
}

// ---------- Main ----------
function CarAuction() {
  const [state, setState] = useState(undefined); // undefined = cargando, null = no existe
  const [uiMode, setUiMode] = useState("landing"); // landing | create | hostpin | identify
  const [isHost, setIsHost] = useState(false);
  const [myName, setMyName] = useState("");
  const [identityLoaded, setIdentityLoaded] = useState(false);
  const [authReady, setAuthReady] = useState(false);
  const [fatal, setFatal] = useState("");
  const [nowTick, setNowTick] = useState(Date.now());
  const [bidInput, setBidInput] = useState("");
  const [formError, setFormError] = useState("");
  const [pinError, setPinError] = useState("");
  const [actionError, setActionError] = useState("");
  const [busy, setBusy] = useState(false);
  const [online, setOnline] = useState(navigator.onLine);
  const firedForTurnRef = useRef(null);

  // ---- auth anónima (las reglas de Firestore exigen sesión) ----
  useEffect(() => {
    const unsub = onAuthStateChanged(auth, (user) => {
      if (user) setAuthReady(true);
    });
    signInAnonymously(auth).catch((e) => {
      setFatal("No se pudo conectar con Firebase. Revisa que la autenticación anónima esté habilitada.");
    });
    return unsub;
  }, []);

  // ---- suscripción en tiempo real al documento de la subasta ----
  useEffect(() => {
    if (!authReady) return;
    const unsub = onSnapshot(
      auctionRef,
      (snap) => setState(snap.exists() ? snap.data() : null),
      (err) => setFatal("No se pudo leer la subasta. Revisa las reglas de Firestore."),
    );
    return unsub;
  }, [authReady]);

  // ---- reloj local para la cuenta regresiva ----
  useEffect(() => {
    const tick = setInterval(() => setNowTick(Date.now()), 1000);
    const up = () => setOnline(true);
    const down = () => setOnline(false);
    window.addEventListener("online", up);
    window.addEventListener("offline", down);
    // Al volver de segundo plano en móvil, refresca el reloj de inmediato
    // para que la cuenta regresiva no se quede "congelada" visualmente.
    const onVisible = () => { if (document.visibilityState === "visible") setNowTick(Date.now()); };
    document.addEventListener("visibilitychange", onVisible);
    return () => {
      clearInterval(tick);
      window.removeEventListener("online", up);
      window.removeEventListener("offline", down);
      document.removeEventListener("visibilitychange", onVisible);
    };
  }, []);

  // ---- identidad persistente ----
  useEffect(() => {
    const me = loadMe();
    if (me) {
      if (me.isHost) setIsHost(true);
      else if (me.myName) setMyName(me.myName);
    }
    setIdentityLoaded(true);
  }, []);

  const becomeHost = useCallback(() => {
    setIsHost(true); setMyName(""); setUiMode("landing");
    saveMe({ isHost: true, myName: "" });
  }, []);
  const becomeParticipant = useCallback((name) => {
    if (!name) return;
    setMyName(name); setIsHost(false);
    saveMe({ isHost: false, myName: name });
  }, []);
  const forgetMe = useCallback(() => {
    setIsHost(false); setMyName(""); setUiMode("landing"); setActionError("");
    clearMe();
  }, []);

  // si la subasta se recreó y mi nombre ya no está en la lista, suelta la identidad
  useEffect(() => {
    if (!state || !myName) return;
    if (!state.participants.includes(myName)) { setMyName(""); clearMe(); }
  }, [state, myName]);

  // ---- pasar turno (transacción: nadie puede pisar a nadie) ----
  const handlePass = useCallback(async (reason, expectedTurnStartedAt = null) => {
    setBusy(true);
    try {
      await runTransaction(db, async (tx) => {
        const snap = await tx.get(auctionRef);
        if (!snap.exists()) return;
        const fresh = snap.data();
        if (fresh.status !== "active") return;
        // si el turno ya avanzó mientras leíamos, no pases al siguiente por error
        if (expectedTurnStartedAt != null && fresh.turnStartedAt !== expectedTurnStartedAt) return;
        const turnName = fresh.order[fresh.currentIndex];
        if (reason === "self" && turnName !== myName) throw new Error("No es tu turno.");
        const activeStatus = { ...fresh.activeStatus, [turnName]: "passed" };
        const activeCount = countActive(activeStatus);
        const entry = { type: reason === "self" ? "pass" : reason, name: turnName, at: nowMs() };
        const next = { ...fresh, activeStatus, history: [...fresh.history, entry] };
        if (activeCount === 0) {
          next.status = "finished"; next.winner = null; next.turnStartedAt = null;
        } else if (activeCount === 1 && fresh.highestBidder) {
          next.status = "finished";
          next.winner = { name: fresh.highestBidder, amount: fresh.highestBid };
          next.turnStartedAt = null;
        } else {
          next.currentIndex = nextActiveIndex(fresh.order, activeStatus, fresh.currentIndex);
          next.turnStartedAt = nowMs();
        }
        tx.set(auctionRef, next);
      });
      setActionError("");
    } catch (e) {
      setActionError(e.message || "No se pudo pasar el turno. Intenta de nuevo.");
    } finally {
      setBusy(false);
    }
  }, [myName]);

  // ---- ofertar (transacción) ----
  const handleBid = useCallback(async () => {
    const amount = Number(bidInput);
    setBusy(true);
    try {
      await runTransaction(db, async (tx) => {
        const snap = await tx.get(auctionRef);
        if (!snap.exists()) throw new Error("La subasta ya no existe.");
        const fresh = snap.data();
        if (fresh.status !== "active") throw new Error("La subasta no está activa.");
        const turnName = fresh.order[fresh.currentIndex];
        if (turnName !== myName) throw new Error("No es tu turno.");
        const minValid = getMinValid(fresh);
        if (!amount || amount < minValid) {
          throw new Error(`La oferta mínima válida es ${fmt(minValid, fresh.vehicle.currency)}.`);
        }
        const activeCount = countActive(fresh.activeStatus);
        const next = {
          ...fresh,
          highestBid: amount,
          highestBidder: myName,
          history: [...fresh.history, { type: "bid", name: myName, amount, at: nowMs() }],
        };
        if (activeCount <= 1) {
          next.status = "finished";
          next.winner = { name: myName, amount };
          next.turnStartedAt = null;
        } else {
          next.currentIndex = nextActiveIndex(fresh.order, fresh.activeStatus, fresh.currentIndex);
          next.turnStartedAt = nowMs();
        }
        tx.set(auctionRef, next);
      });
      setActionError("");
      setBidInput("");
    } catch (e) {
      setActionError(e.message || "No se pudo registrar la oferta.");
    } finally {
      setBusy(false);
    }
  }, [bidInput, myName]);

  // ---- oferta mínima precargada cuando llega mi turno ----
  useEffect(() => {
    if (state && state.status === "active" && state.order[state.currentIndex] === myName) {
      setBidInput(String(getMinValid(state)));
    }
  }, [state?.currentIndex, state?.highestBid, myName]);

  // ---- tiempo agotado ----
  // Solo lo dispara la persona del turno; el organizador es respaldo 3s después,
  // por si esa persona cerró la app. Así no disparan los 35 dispositivos a la vez.
  useEffect(() => {
    if (!state || state.status !== "active" || state.turnStartedAt == null) return;
    const remaining = state.vehicle.turnDuration - Math.floor((nowTick - state.turnStartedAt) / 1000);
    const turnOwner = state.order[state.currentIndex];
    const iFire = turnOwner === myName ? remaining <= 0 : isHost && remaining <= -3;
    if (iFire && firedForTurnRef.current !== state.turnStartedAt) {
      firedForTurnRef.current = state.turnStartedAt;
      handlePass("timeout", state.turnStartedAt);
    }
  }, [nowTick, state, handlePass, myName, isHost]);

  async function handleCreateAuction(form) {
    setFormError("");
    const participants = form.namesText.split("\n").map((s) => s.trim()).filter(Boolean);
    if (participants.length < 2) { setFormError("Agrega al menos 2 participantes."); return; }
    if (!form.minPrice || !form.increment) { setFormError("Define el precio mínimo y el incremento mínimo."); return; }
    if (!/^\d{4}$/.test(form.hostPin || "")) { setFormError("El PIN del organizador debe tener 4 dígitos."); return; }
    const dupes = participants.filter((p, i) => participants.indexOf(p) !== i);
    if (dupes.length) { setFormError(`Hay nombres repetidos: ${[...new Set(dupes)].join(", ")}.`); return; }
    setBusy(true);
    try {
      const existing = await getDoc(auctionRef);
      if (existing.exists()) {
        setFormError(`Ya hay una subasta en la sala "${SALA}". Reiníciala o usa otra sala con ?sala=nombre.`);
        return;
      }
      const activeStatus = {};
      participants.forEach((p) => (activeStatus[p] = "active"));
      const initial = {
        status: "lobby",
        vehicle: {
          title: form.title || "Vehículo",
          subtitle: form.subtitle || "",
          currency: form.currency || "$",
          minPrice: Number(form.minPrice) || 0,
          increment: Number(form.increment) || 1,
          turnDuration: Number(form.turnDuration) || 30,
        },
        hostPinHash: await hashPin(form.hostPin),
        participants,
        order: [],
        activeStatus,
        currentIndex: null,
        highestBid: null,
        highestBidder: null,
        turnStartedAt: null,
        history: [{ type: "created", at: nowMs() }],
        winner: null,
        createdAt: nowMs(),
      };
      await setDoc(auctionRef, initial);
      becomeHost();
    } catch (e) {
      setFormError("No se pudo crear la subasta. Revisa la conexión y las reglas de Firestore.");
    } finally {
      setBusy(false);
    }
  }

  async function handleStart() {
    setBusy(true);
    try {
      await runTransaction(db, async (tx) => {
        const snap = await tx.get(auctionRef);
        if (!snap.exists()) return;
        const fresh = snap.data();
        if (fresh.status !== "lobby") return;
        tx.set(auctionRef, {
          ...fresh,
          status: "active",
          order: shuffle(fresh.participants),
          currentIndex: 0,
          turnStartedAt: nowMs(),
          history: [...fresh.history, { type: "start", at: nowMs() }],
        });
      });
    } catch (e) {
      setActionError("No se pudo iniciar la subasta.");
    } finally {
      setBusy(false);
    }
  }

  async function handleReset() {
    if (!window.confirm("¿Reiniciar toda la subasta? Esto borra el progreso actual para todos.")) return;
    try { await deleteDoc(auctionRef); } catch (e) { setActionError("No se pudo reiniciar."); return; }
    forgetMe();
  }

  async function handleHostPin(pin) {
    setBusy(true);
    try {
      const hash = await hashPin(pin);
      if (state && hash === state.hostPinHash) { setPinError(""); becomeHost(); }
      else setPinError("PIN incorrecto.");
    } finally {
      setBusy(false);
    }
  }

  // ---------- render ----------
  if (fatal) {
    return <Shell><Card><p className="text-red-400 text-sm">{fatal}</p></Card></Shell>;
  }
  if (!identityLoaded || !authReady || state === undefined) {
    return <Shell><p className="text-slate-400">Conectando…</p></Shell>;
  }

  const identified = isHost || !!myName;
  if (!identified) {
    if (uiMode === "create") {
      return <CreateForm onCreate={handleCreateAuction} onBack={() => setUiMode("landing")} error={formError} busy={busy} />;
    }
    if (uiMode === "hostpin") {
      if (!state) return <Shell><p className="text-slate-400">Aún no se ha creado la subasta.</p></Shell>;
      return (
        <HostPinForm
          onBack={() => { setPinError(""); setUiMode("landing"); }}
          error={pinError}
          busy={busy}
          onConfirm={handleHostPin}
        />
      );
    }
    if (uiMode === "identify") {
      if (!state) return <Shell><p className="text-slate-400">Aún no se ha creado la subasta.</p></Shell>;
      return (
        <IdentifyForm
          participants={state.participants}
          onBack={() => setUiMode("landing")}
          onConfirm={becomeParticipant}
        />
      );
    }
    return (
      <Landing
        auctionExists={!!state}
        onChooseHost={() => setUiMode(state ? "hostpin" : "create")}
        onChooseParticipant={() => setUiMode("identify")}
      />
    );
  }

  if (state === null) {
    return (
      <Shell>
        <p className="text-slate-400 mb-4">La subasta fue reiniciada.</p>
        <PrimaryButton onClick={forgetMe}>Volver al inicio</PrimaryButton>
      </Shell>
    );
  }

  if (state.status === "lobby") {
    return <Lobby state={state} isHost={isHost} myName={myName} onStart={handleStart} onReset={handleReset} onForget={forgetMe} online={online} />;
  }

  if (state.status === "active") {
    return (
      <ActiveBoard
        state={state}
        isHost={isHost}
        myName={myName}
        nowTick={nowTick}
        bidInput={bidInput}
        setBidInput={setBidInput}
        onBid={handleBid}
        onPass={() => handlePass("self")}
        onForcePass={() => handlePass("forced")}
        onReset={handleReset}
        onForget={forgetMe}
        actionError={actionError}
        busy={busy}
        online={online}
      />
    );
  }

  return <Finished state={state} isHost={isHost} myName={myName} onReset={handleReset} onForget={forgetMe} />;
}

document.getElementById("boot").remove();
createRoot(document.getElementById("root")).render(<CarAuction />);
</script>
</body>
</html>
