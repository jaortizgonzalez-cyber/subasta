/* Altura real de pantalla en móvil: 100vh no descuenta la barra de

.app-shell {

/* Evita el zoom automático de iOS al enfocar un input (ocurre si el

input, select, textarea {

}

/* Quita el retraso de ~300ms al tocar y el "doble tap zoom" accidental
   en botones y elementos interactivos. */
button, a, select {

/* Oculta las flechitas (spinners) de los inputs numéricos para que se

input[type="number"] {
